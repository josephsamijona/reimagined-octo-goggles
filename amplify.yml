version: 1
frontend:
  phases:
    preBuild:
      commands:
        - cd adminfrontend
        - nvm use 20
        - npm install --force
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: adminfrontend/build
    files:
      - '**/*'
  cache:
    paths:
      - adminfrontend/node_modules/**/*
  customHeaders:
    - pattern: '**/*'
      headers:
        - key: Strict-Transport-Security
          value: max-age=31536000; includeSubDomains
        - key: X-Content-Type-Options
          value: nosniff
        - key: X-Frame-Options
          value: DENY
        - key: X-XSS-Protection
          value: 1; mode=block
    - pattern: /assets/*
      headers:
        - key: Cache-Control
          value: public, max-age=31536000, immutable
